name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Initialize Log and Report Directories
        run: |
          mkdir -p logs reports

      - name: Code Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics > logs/flake8_advisory.log

      - name: Run Data Pipeline (Acquisition & EDA)
        run: |
          python data_pipeline.py > logs/data_pipeline.log 2>&1

      - name: Pre-Training Phase - Run Independent Data Unit Tests
        run: |
          pytest test_data_processing.py -v --junitxml=reports/data_test_report.xml

      - name: Run Model Pipeline (Train & Track via MLflow)
        run: |
          python model_pipeline.py > logs/model_pipeline.log 2>&1

      - name: Post-Training Phase - Run Model & Inference Integration Tests
        run: |
          pytest test_model_integration.py -v --junitxml=reports/model_integration_report.xml

      - name: Upload ML Artifacts, Reports, and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts
          path: |
            heart_disease_dataset/
            mlflow.db
            logs/
            reports/
          retention-days: 60